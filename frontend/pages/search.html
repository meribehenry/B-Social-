<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css"> 
    <link rel="stylesheet" href="../css/components/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components/posts.css">
    <title>B-Social-Search</title>
</head>
<body data-page="search">
    <main id="main-page">
        <section class="container notification-page-first-section">
            <h4>Search</h4>
            <div class="notification-page-first-section-image-container">
                <img class="search-back-icon" src="../images/default.jpg" alt="">
                <form class="search-area" action="">
                    <input class="search-box" type="text" placeholder="Search" name="search">
                    <button class="search-submit-button" type="submit"><img class="search-icon" src="../svgs/search-outline.svg" alt="Search Icon"></button>
                </form>
                <img class="logo-md" src="../images/logo.png" alt="Logo">
            </div>   
        </section>

        <section id="search-results-section" class="search-results-section">

        </section>

    </main>
    
    <script type="module" src="../js/app.js"></script>
</body>
</html>
